<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover → safe-area-inset env() works on iPhone notch + Dynamic Island.
      interactive-widget=resizes-visual → prevents layout reflow when virtual keyboard opens on mobile.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Prevent iOS from auto-linking phone/address/dates in content -->
    <meta name="format-detection" content="telephone=no, address=no, email=no" />

    <!-- CSP is enforced at the HTTP header level via vercel.json (harder to bypass than a meta tag).
         This meta tag is kept as a defence-in-depth fallback for non-Vercel environments only. -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' https://res.cloudinary.com blob:; connect-src 'self' https://api.myothant.dev https://vedin-backend.onrender.com https://www.gstatic.com https://api.unsplash.com https://ipapi.co https://nominatim.openstreetmap.org; frame-ancestors 'none'; upgrade-insecure-requests;">

    <!-- ════════════════ SEO / Social ════════════════ -->
    <title>Vedin — Professional Vedic Astrology | Sayar Bhone Min Thike Din</title>
    <meta name="description"
        content="Vedin — accurate Vedic astrology readings by Sayar Bhone Min Thike Din. Chandra Lagna (Moon ascendant), D1–D60 divisional charts, Vimśottarī dasha, Shadbala & Ashtakavarga, computed with classical Vedic-astrology methods." />
    <meta name="author" content="Sayar Bhone Min Thike Din" />
    <meta name="keywords"
        content="Vedin, Vedic astrology, horoscope, Chandra Lagna, Moon ascendant, Vimshottari dasha, Shadbala, Ashtakavarga, natal chart, kundli, divisional charts, Myanmar astrology, Burmese astrology, ဗေဒင်" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#08090F" />
    <meta name="application-name" content="Vedin" />
    <meta name="apple-mobile-web-app-title" content="Vedin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="canonical" href="https://myothant.dev/" />
    <link rel="icon" href="/vedin-logo.png" />
    <link rel="apple-touch-icon" href="/vedin-logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

    <!-- Fonts + Font Awesome load NON-render-blocking (preload → stylesheet via
         /css-swap.js) so third-party CSS latency never delays first paint on
         mobile. <noscript> keeps them working when JS is unavailable. -->
    <link rel="preload" as="style" data-async-style
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&family=Padauk:wght@400;700&family=Noto+Sans+Myanmar:wght@400;500;600&family=Orbitron:wght@400;600;700;800;900&display=swap" />
    <link rel="preload" as="style" data-async-style
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <noscript>
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&family=Padauk:wght@400;700&family=Noto+Sans+Myanmar:wght@400;500;600&family=Orbitron:wght@400;600;700;800;900&display=swap" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    </noscript>
    <script src="/css-swap.js" defer></script>

    <!-- Instant boot-splash styles (inline <style> is allowed by style-src
         'unsafe-inline'; contains NO inline JS, so it is CSP-safe). The splash is
         faded out and removed by main.tsx once React has mounted. -->
    <style>
        #boot-splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #08090F;
            transition: opacity .35s ease
        }

        #boot-splash .bs-spin {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 3px solid rgba(233, 237, 245, .14);
            border-top-color: #22D3EE;
            box-shadow: 0 0 16px rgba(34, 211, 238, .5);
            animation: bs-rot .8s linear infinite
        }

        #boot-splash.bs-hide {
            opacity: 0;
            pointer-events: none
        }

        @keyframes bs-rot {
            to {
                transform: rotate(360deg)
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #boot-splash .bs-spin {
                animation-duration: 2.4s
            }
        }
    </style>
</head>

<body>
    <!-- Crawler / no-JS fallback: gives search engines real content for this SPA -->
    <noscript>
        <h1>Vedin — Professional Vedic Astrology</h1>
        <p>Accurate Vedic astrology readings by Sayar Bhone Min Thike Din — Chandra Lagna (Moon ascendant),
            the sixteen divisional charts (D1–D60), the Vimśottarī dasha timeline, Shadbala strengths and
            the Ashtakavarga point system.</p>
        <p>Please enable JavaScript to use the interactive Vedin app.</p>
    </noscript>

    <div id="root"></div>

    <!-- Instant loading splash: paints immediately (pure CSS, no JS) so mobile
         never shows a blank screen during the JS bootstrap. main.tsx fades and
         removes it once React mounts. If JS is disabled, the <noscript> below
         hides it so the crawler/no-JS fallback content stays visible. -->
    <div id="boot-splash" aria-hidden="true">
        <div class="bs-spin"></div>
    </div>
    <noscript>
        <style>
            #boot-splash {
                display: none !important
            }
        </style>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
